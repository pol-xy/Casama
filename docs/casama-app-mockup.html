<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Casama</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
body{margin:0;background:#121517;font-family:Inter,sans-serif;color:#1C2E4A;-webkit-tap-highlight-color:transparent}
.h{font-family:'Plus Jakarta Sans',sans-serif}
.mi{font-family:'Material Symbols Outlined';font-weight:400;font-size:22px;line-height:1;display:inline-block;font-variation-settings:'FILL' 0;user-select:none}
.mi.f{font-variation-settings:'FILL' 1}
.p{transition:transform .15s}.p:active{transform:scale(.95)}
.fab{transition:transform .15s}.fab:active{transform:scale(.9)}
.circ{width:48px;height:48px;border-radius:99px;background:#fff;border:1px solid #DCE3E0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px #0001;position:relative;flex-shrink:0}
.card{background:#fff;border:1px solid #DCE3E0;border-radius:20px;box-shadow:0 1px 3px #0000000a}
.sub{font-size:11.5px;color:#54646C}.lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#54646C}
.pl{height:36px;padding:0 16px;border-radius:99px;background:#fff;border:1px solid #DCE3E0;font-size:12px;font-weight:500;white-space:nowrap;flex-shrink:0}
.pl.on{background:#37655E;color:#fff;border-color:#37655E;font-weight:600}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}
.btn{height:40px;padding:0 14px;border-radius:99px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;border:1px solid #DCE3E0;background:#fff}
.btn.c{background:#C44938;color:#fff;border-color:#C44938}
.inp{width:100%;height:50px;border-radius:14px;background:#EAE6DF;padding:0 16px;font-size:14px;font-weight:500;outline:none;border:1px solid transparent}.inp:focus{background:#fff;border-color:#37655E}
.cta{width:100%;height:52px;border-radius:99px;background:#C44938;color:#fff;font-weight:600;font-size:15px;box-shadow:0 4px 14px #C4493859}
.scr{display:none}.scr.on{display:block}
.no-sb::-webkit-scrollbar,#sc::-webkit-scrollbar{display:none}.no-sb{scrollbar-width:none}
@keyframes up{from{transform:translateY(100%)}}@keyframes inl{from{transform:translateX(-100%)}}@keyframes fd{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.9)}}.fi{animation:pop .22s ease-out backwards}
@keyframes slr{from{transform:translateX(48px);opacity:0}}@keyframes sll{from{transform:translateX(-48px);opacity:0}}
@keyframes fabin{from{opacity:0;transform:translateY(28px) scale(.6)}}@keyframes fabout{to{opacity:0;transform:translateY(28px) scale(.6)}}
.popin{animation:fabin .32s cubic-bezier(.34,1.56,.64,1)}.popout{animation:fabout .18s ease-in forwards}.big .em{font-size:96px}
.sp{animation:up .28s ease-out}.dp{animation:inl .25s ease-out}.sc{animation:fd .2s}
.chk:checked+span{background:#2E7D32;border-color:#2E7D32}.chk:checked+span svg{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div id="app" class="relative w-full max-w-[390px] h-[100dvh] max-h-[900px] mx-auto bg-[#EAE4D7] overflow-hidden sm:my-4 sm:rounded-[36px]">
  <div id="sc" class="absolute inset-0 overflow-y-auto pb-28" style="touch-action:pan-y"></div>
  <nav id="nav" class="absolute bottom-0 inset-x-0 h-[72px] bg-white rounded-t-[28px] border-t border-[#DCE3E0] shadow-[0_-4px_20px_#071C3714] z-30 grid grid-cols-5 items-center px-2"></nav>
  <button id="bfab" onclick="fab()" class="fab hidden absolute right-4 bottom-[88px] z-30 h-14 pl-4 pr-5 rounded-full bg-[#E87461] text-white flex items-center gap-2 font-semibold text-sm shadow-[0_4px_16px_#E8746173]"><span id="bfi" class="mi">add</span><span id="bfl">Add</span></button>
  <div id="dr" class="absolute inset-0 z-40 hidden"></div>
  <div id="sh" class="absolute inset-0 z-50 hidden"></div>
  <div id="gal" class="hidden absolute inset-0 z-[55] bg-[#EAE4D7] overflow-y-auto no-sb sc"></div>
  <div id="cam" class="hidden absolute inset-0 z-[60] bg-[#070C16] text-white overflow-hidden sc"></div>
  <div id="lbx" class="hidden absolute inset-0 z-[70] bg-black/80 flex items-center justify-center p-8 sc" onclick="this.classList.add('hidden')"></div>
  <div id="tst" class="hidden sc absolute top-20 left-1/2 -translate-x-1/2 z-[80] bg-[#1C2E4A] text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg"></div>
</div>
<script>
const $=s=>document.querySelector(s), I=(n,c='')=>`<span class="mi ${c}">${n}</span>`;
const EXT='png'; // pose files: assets/pose-idle.png, pose-box, pose-clean, pose-phone
const OWL=`<svg viewBox="0 0 100 105" class="w-full h-full" fill="none"><ellipse cx="50" cy="62" rx="34" ry="38" fill="#3F7B76"/><path d="M26 38C22 18 40 18 42 32ZM74 38C78 18 60 18 58 32Z" fill="#2D625F"/><ellipse cx="50" cy="72" rx="22" ry="26" fill="#FFF8F2"/><circle cx="38" cy="46" r="13" fill="#fff"/><circle cx="62" cy="46" r="13" fill="#fff"/><circle cx="40" cy="46" r="7" fill="#1C2E4A"/><circle cx="60" cy="46" r="7" fill="#1C2E4A"/><circle cx="42" cy="44" r="2.5" fill="#fff"/><circle cx="62" cy="44" r="2.5" fill="#fff"/><path d="M50 49l-4 7h8Z" fill="#C74736"/><path d="M30 60c8 5 32 5 40 0 1 5-4 8-20 8s-21-3-20-8Z" fill="#C74736"/></svg>`;
const owl=p=>`<div class="relative w-full h-full">${OWL}<img src="assets/pose-${p}.${EXT}" alt="" class="absolute inset-0 w-full h-full object-contain" onerror="this.remove()"></div>`;
const av=(l,c,s=40)=>`<div class="h rounded-full text-white font-bold flex items-center justify-center shrink-0" style="width:${s}px;height:${s}px;background:${c};font-size:${s/3.2}px">${l}</div>`;
const C={JP:'#37655E',M:'#C44938',A:'#1C2E4A',R:'#688C83'};
const dot=c=>`<i class="inline-block w-2 h-2 rounded-full" style="background:${c}"></i>`;

let TB='';
const hdr=(t,s,right='',tb=TB?tabs(TB):'')=>`<div class="relative bg-[#37655E] pt-4 pb-10 px-4 overflow-hidden">
<svg class="absolute -top-6 -right-6 w-32 h-32 opacity-40" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="38" stroke="#F4B544" stroke-dasharray="4 3" stroke-width="1.5"/><circle cx="50" cy="50" r="26" stroke="#F4B544"/><circle cx="26" cy="68" r="2.5" fill="#F4B544"/></svg>
<svg class="absolute bottom-0 left-0 w-full h-10" viewBox="0 0 390 40" preserveAspectRatio="none"><path d="M0 14C100 28 230 2 390 18V40H0Z" fill="#688C83"/><path d="M0 26C120 38 270 12 390 28V40H0Z" fill="#A5B9B0"/><path d="M0 36C140 40 280 24 390 36V40H0Z" fill="#EAE4D7"/></svg>
<div class="relative flex items-center justify-between"><button onclick="drawer(1)" aria-label="Open menu" class="circ p"><div class="flex flex-col gap-1.5 items-start"><i class="w-5 h-[2px] bg-[#1C2E4A] rounded"></i><i class="w-3.5 h-[2px] bg-[#1C2E4A] rounded"></i></div></button>
<div class="flex items-center gap-2">${right}<button aria-label="Notifications" class="circ p">${I('notifications')}<i class="absolute top-3 right-3 w-2 h-2 rounded-full bg-[#E87461]"></i></button></div></div>
${tb}<h1 class="relative h text-white text-2xl font-bold mt-3 leading-tight">${t}</h1><p class="relative text-[13px] text-[#EAE4D7]">${s}</p></div>`;
const pill=(ic,t,fn)=>`<button onclick="${fn}" class="p h-11 px-3.5 rounded-full bg-white border border-[#DCE3E0] flex items-center gap-1.5 text-xs font-semibold shadow-sm">${I(ic,'!text-[16px] text-[#37655E]')}${t}</button>`;
const sum=(p,a,as,b,bs,bc='#37655E')=>`<div class="relative px-4 -mt-5"><div class="absolute right-8 -top-11 w-[76px] h-[76px] pointer-events-none">${owl(p)}</div><div class="card relative flex items-center p-3 px-4 !rounded-[18px]"><div class="flex-1 min-w-0"><div class="h font-bold text-[17px]">${a}</div><div class="sub truncate">${as}</div></div><div class="w-px h-9 bg-[#DCE3E0] mx-3"></div><div class="flex-1 min-w-0"><div class="h font-bold text-[17px]" style="color:${bc}">${b}</div><div class="sub truncate">${bs}</div></div></div></div>`;
const pills=(g,a)=>`<div class="flex gap-2 overflow-x-auto no-sb px-4 py-3">${a.map(([v,l],i)=>`<button onclick="flt(this,'${g}','${v}')" class="pl p ${i?'':'on'}">${l}</button>`).join('')}</div>`;
const seg=(g,a)=>`<div class="px-4 py-3"><div class="h-12 bg-[#EAE6DF] border border-[#DCE3E0] rounded-full p-1 flex">${a.map(([v,l],i)=>`<button onclick="sg(this,'${g}','${v}')" class="sgb flex-1 rounded-full text-[13px] ${i?'text-[#54646C] font-medium':'bg-white font-bold shadow border border-[#DCE3E0]'}">${l}</button>`).join('')}</div></div>`;
function flt(b,g,v){b.parentNode.querySelectorAll('.pl').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll(`[data-g="${g}"]`).forEach(e=>e.style.display=(v=='all'||e.dataset.f.split(' ').includes(v))?'':'none')}
function sg(b,g,v){b.parentNode.querySelectorAll('.sgb').forEach(x=>x.className='sgb flex-1 rounded-full text-[13px] text-[#54646C] font-medium');b.className='sgb flex-1 rounded-full text-[13px] bg-white font-bold shadow border border-[#DCE3E0]';document.querySelectorAll(`[data-g="${g}"]`).forEach(e=>e.style.display=e.dataset.f==v?'':'none')}
const ico=(n,bg,c)=>`<div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style="background:${bg};color:${c}">${I(n)}</div>`;

const S={};
S.home=()=>hdr('Good evening, JP','Welcome home to Casa 204')+`
<div class="px-4 -mt-6 flex items-end gap-3"><div class="w-[36%] h-[112px] shrink-0 relative z-10">${owl('idle')}</div>
<div class="card flex-1 p-3.5 mb-2 relative z-10"><div class="lbl">Casa 204 Status</div><div id="hc" class="h font-bold text-[22px] my-0.5">3 of 4 Home</div><div class="sub">1 parcel arriving • 2 alerts</div></div></div>
<div class="card mx-4 mt-3 p-3.5 !rounded-2xl"><div class="flex items-center justify-between"><div><div class="lbl">Who's Home</div><div class="sub">Updated 2m ago</div></div>
<button id="tg" onclick="tg()" class="p flex items-center gap-1.5 h-[34px] px-2.5 rounded-full bg-[#E8F5E9] text-[#2E7D32]">${dot('#2E7D32')}<span class="text-[11.5px] font-semibold">You: Home</span></button></div>
<div class="flex justify-between mt-3 px-1">${[['JP','You','JP',1],['M','Maria','M',1],['A','Alex','A',0],['R','Ria','R',1]].map(([l,n,k,h])=>`<div class="flex flex-col items-center gap-1">${av(l,C[k])}<span class="text-xs font-medium">${n}</span><span class="badge !font-medium" style="background:${h?'#E8F5E9':'#EEE'};color:${h?'#2E7D32':'#595959'}">${h?'Home':'Out'}</span></div>`).join('')}</div></div>
<div class="mx-4 mt-4"><div class="flex justify-between mb-2"><span class="lbl">Live Attention Needed</span><span class="text-xs font-semibold text-[#C44938]">2 actions</span></div>
<button onclick="go('bills')" class="p w-full h-[58px] rounded-[14px] bg-[#FFF3F0] px-3.5 flex items-center justify-between mb-2 text-left"><div class="flex items-center gap-3">${ico('receipt_long','#FFECE8','#C44938')}<div><div class="text-[13.5px] font-bold">PLDT Wi-Fi • Overdue</div><div class="sub">Due Nov 18</div></div></div><div class="text-right"><div class="text-[13px] font-bold">₱1,299.00</div><div class="text-[11.5px] font-semibold text-[#C44938]">Settle ›</div></div></button>
<button onclick="go('tasks')" class="p w-full h-[58px] rounded-[14px] bg-[#F1F6F3] px-3.5 flex items-center justify-between text-left"><div class="flex items-center gap-3">${ico('handyman','#E0ECE7','#37655E')}<div><div class="text-[13.5px] font-bold">Leaking Faucet</div><div class="sub">Assigned to Alex • Urgent</div></div></div>${I('chevron_right','text-[#37655E]')}</button></div>
${snapCard()}
<div class="card mx-4 mt-4 p-3.5"><div class="flex justify-between items-center"><div class="flex items-center gap-1.5">${dot('#2E7D32')}<b class="h text-[14.5px]">Casa Schedule</b></div><span class="text-[11px] bg-[#EAE6DF] px-2.5 py-1 rounded-full">2 activities • November 2026</span></div>
<div class="grid grid-cols-5 gap-1.5 mt-3">${['Mon 23','Tue 24','Wed 25','Thu 26','Fri 27'].map((d,i)=>{const [w,n]=d.split(' ');return `<div class="p flex flex-col items-center py-1.5 rounded-xl ${i==2?'bg-[#37655E] text-white':'bg-[#F0F3FF]'}"><span class="text-[10.5px] opacity-80">${w}</span><b class="text-[13px]">${n}</b></div>`}).join('')}</div>
<div class="mt-3 flex items-center justify-between"><div class="flex items-center gap-2.5"><span class="text-[11px] font-bold bg-[#EAE6DF] px-2 py-1 rounded-[10px]">25 NOV</span><div><div class="text-[13.5px] font-semibold">Shopee COD Parcel (₱350)</div><div class="sub">For Maria • 4:35 PM</div></div></div>${dot('#E87461')}</div>
<div class="mt-2 flex items-center justify-between"><div class="flex items-center gap-2.5"><span class="text-[11px] font-bold bg-[#EAE6DF] px-2 py-1 rounded-[10px]">25 NOV</span><div><div class="text-[13.5px] font-semibold">Study Session</div><div class="sub">Common Area • 7:00 PM</div></div></div>${dot('#37655E')}</div></div>`;

S.chat=()=>hdr('Chat','Casa 204 • 4 members',pill('person_add','','sheet(\'invite\')').replace('px-3.5','!w-12 !px-0 justify-center')+pill('calendar_add_on','','sheet(\'meetup\')').replace('px-3.5','!w-12 !px-0 justify-center'))+`
<div class="px-4 -mt-6 flex items-end gap-3"><div class="w-[36%] h-[110px] shrink-0 relative z-10">${owl('phone')}</div><div class="card flex-1 p-3 mb-2 relative z-10"><div class="flex items-center gap-1.5 mb-1">${dot('#2E7D32')}<span class="lbl">Casa 204 Connect</span></div><div class="h font-bold text-lg leading-snug">2 Unread • 1 Space</div><div class="sub">3 housemates Home right now</div></div></div>
<div class="px-4 mt-3"><div class="h-12 bg-white border border-[#DCE3E0] rounded-full px-4 flex items-center gap-3 focus-within:ring-2 focus-within:ring-[#37655E]/40">${I('search','!text-[18px] text-[#58413E]')}<input class="w-full bg-transparent outline-none text-sm" placeholder="Search Casa 204 chats or housemates..."></div></div>
<div class="px-4 mt-4"><div class="lbl mb-1.5">Household Group Chat</div><button onclick="go('thread')" class="p w-full bg-[#37655E] rounded-[18px] p-3.5 flex items-center gap-3.5 text-white text-left"><div class="w-[46px] h-[46px] rounded-xl bg-white/15 flex items-center justify-center">${I('cottage')}</div><div class="flex-1 min-w-0"><div class="flex justify-between"><b class="h">Casa 204</b><span class="text-[11px] opacity-90">3:55 PM</span></div><div class="flex justify-between gap-2 mt-0.5"><span class="text-sm truncate opacity-95"><b>Alex:</b> Thanks! Just let us know when it arrives.</span><span class="w-[22px] h-[22px] rounded-full bg-[#C44938] text-xs font-bold flex items-center justify-center shrink-0">2</span></div></div></button></div>
<div class="px-4 mt-4"><div class="flex items-center justify-between mb-1.5"><span class="lbl">Custom Chat Spaces (1)</span><button onclick="sheet('space')" class="p h-9 px-3.5 rounded-full bg-white border border-[#37655E] text-[#37655E] text-xs font-semibold flex items-center gap-1">${I('add','!text-[15px]')}Space / Code</button></div>
<div class="card p-3 flex items-center gap-3 !rounded-2xl">${ico('shopping_basket','#B4EEE7','#356D69')}<div class="min-w-0 flex-1"><div class="flex justify-between"><div class="flex gap-2 items-center"><b class="text-base">Grocery &amp; Supplies</b><span class="text-[11px] font-bold bg-[#DFE8FF] px-2 rounded-full">SPC-101</span></div><span class="sub">12:35 PM</span></div><div class="sub truncate">3 members • Maria: We need paper towels and olive oil...</div></div></div></div>
<div class="px-4 mt-4"><div class="lbl mb-1.5">Housemates</div><div class="card !rounded-2xl overflow-hidden">${[['M','Maria','You: Got it! Placed it on the living room table.','3:47 PM',1],['A','Alex','See you later at the study session!','3:35 PM',0],['R','Ria','Sent a photo of the groceries we need.','2:35 PM',1]].map(([k,n,m,t,h],i)=>`<div class="p px-3.5 py-3 flex items-center gap-3 ${i?'border-t border-[#E7EEFF]':''}"><div class="relative">${av(k,C[k],44)}<i class="absolute bottom-0 right-0 w-3 h-3 rounded-full ring-2 ring-white" style="background:${h?'#2E7D32':'#595959'}"></i></div><div class="min-w-0 flex-1"><div class="flex justify-between"><b>${n}</b><span class="sub">${t}</span></div><div class="sub !text-[13px] truncate">${m}</div></div></div>`).join('')}</div></div>
<div class="px-4 mt-4"><div class="lbl mb-1.5">Active Meet-up</div><div class="card p-3 flex items-center gap-3 !rounded-2xl"><div class="w-[42px] h-[42px] rounded-full bg-[#B4EEE7] text-[#356D69] flex items-center justify-center">${I('groups')}</div><div class="flex-1 min-w-0"><b class="block">Study Session</b><div class="sub truncate">Today, 7:00 PM • Common Area • 3 going</div></div><button onclick="go('thread')" class="btn !bg-[#DFE8FF] !border-0">View</button></div></div>`;

S.thread=()=>`<div class="relative bg-[#37655E] pt-4 px-4 pb-6 flex items-center gap-3 overflow-hidden"><svg class="absolute -top-3 right-1 w-24 h-24 opacity-40" viewBox="0 0 96 96" fill="none"><circle cx="48" cy="48" r="34" stroke="#F4B544" stroke-dasharray="3 3" stroke-width="1.5"/><circle cx="48" cy="48" r="24" stroke="#F4B544" stroke-width="1.5"/></svg>
<button onclick="go('chat')" aria-label="Back" class="circ p">${I('arrow_back')}</button><div class="w-[42px] h-[42px] rounded-[14px] bg-white/15 border border-white/30 flex items-center justify-center text-white">${I('home','f')}</div><div class="flex-1 text-white"><b class="h block leading-tight">Casa 204</b><span class="text-xs text-[#EAE4D7]">4 members • 3 Home</span></div><button onclick="sheet('invite')" aria-label="Members" class="circ p">${I('groups')}</button></div>
<div class="px-4 py-3 space-y-3 pb-24"><div class="text-center"><span class="text-[11px] bg-white border border-[#DCE3E0] rounded-full px-3 py-1 text-[#54646C]">Today</span></div>
${[['M','Maria','Hey everyone! Who\'s available to receive my Shopee parcel tomorrow?','3:50 PM'],['','','I\'m available after 2 PM! I can receive it for you.','3:53 PM'],['A','Alex','Thanks! Just let us know when it arrives.','3:55 PM']].map(([k,n,m,t])=>k?`<div class="flex items-end gap-2 max-w-[82%]">${av(k,C[k],34)}<div class="bg-white border border-[#DCE3E0] rounded-[18px] rounded-tl-[4px] px-3.5 py-3"><b class="text-xs text-[#37655E]">${n}</b><p class="text-sm leading-[1.45]">${m}</p><div class="text-right sub">${t}</div></div></div>`:`<div class="flex justify-end"><div class="max-w-[82%] bg-[#37655E] text-white rounded-[18px] rounded-tr-[4px] px-3.5 py-3"><p class="text-sm leading-[1.45]">${m}</p><div class="text-right text-[11px] text-[#EAE4D7] flex justify-end items-center gap-1">${t}${I('done_all','!text-[14px]')}</div></div></div>`).join('')}
<div class="card !border-[1.5px] !border-[#37655E] p-4"><div class="flex justify-between"><span class="badge bg-[#E0ECE7] text-[#37655E] tracking-wider">MEET-UP INVITATION</span><span class="sub">By JP • 6:39 PM</span></div><div class="flex items-center gap-3.5 mt-3">${ico('event','#E0ECE7','#37655E')}<div><b class="h block">Study Session</b><span class="sub">Today, 7:00 PM • Dorm Common Area</span></div></div>
<div class="grid grid-cols-3 gap-2 mt-3.5">${[['going','Going (3)'],['maybe','Maybe (1)'],['cant','Can\'t (0)']].map(([k,l],i)=>`<button onclick="rsvp(this)" class="rsvp p h-12 rounded-full text-xs font-semibold border ${i?'bg-white border-[#DCE3E0]':'bg-[#2E7D32] text-white border-[#2E7D32]'}">${l}</button>`).join('')}</div></div></div>
